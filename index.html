<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platter Challenge – Best Sellers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,9..32,700;0,9..32,900&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white antialiased">
  <main>
    <section class="best-sellers max-w-[1920px] mx-auto px-6 py-9" aria-labelledby="best-sellers-heading">
      <header class="flex flex-col items-center md:flex-row md:justify-between mb-6">
        <h2 id="best-sellers-heading" class="best-sellers__heading text-center text-[28px] font-bold md:text-[40px] md:font-black">
          Best Sellers
        </h2>
        <a href="#best-sellers" class="hidden md:inline-flex items-center gap-2 font-semibold text-sm hover:opacity-70">
          Shop All Best Sellers
        </a>
      </header>

      <product-list-view>
        <div class="best-sellers__grid-wrap" id="best-sellers-grid" data-grid-wrap>
          <ul class="best-sellers__track grid grid-cols-2 gap-x-[11px] gap-y-[12px] w-full max-w-full min-w-0 md:flex md:gap-6 md:overflow-x-auto md:snap-x md:snap-mandatory md:py-6" data-products-track aria-label="Product list">
            <!-- Product cards will be injected here -->
          </ul>
        </div>
        <div class="md:hidden mt-4" data-show-more-wrap>
          <button type="button" class="show-more-btn w-full py-4 rounded-full font-semibold bg-[#1C1D1D] text-white" data-show-more aria-expanded="false" aria-controls="best-sellers-grid">
            Show More
          </button>
        </div>
      </product-list-view>
    </section>
  </main>
  <template id="product-card-template">
    <li class="best-sellers__item">
      <article class="product-card">
        <a href="#" class="block group">
          <div class="product-card__image-wrap relative aspect-square rounded-[10px] overflow-hidden bg-gray-100">
            <img class="product-card__img product-card__img--primary absolute inset-0 w-full h-full object-cover transition-opacity duration-200 group-hover:opacity-0" src="" alt="" />
            <img class="product-card__img product-card__img--secondary absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-200 group-hover:opacity-100" src="" alt="" />
            <div class="product-card__badges absolute top-2 left-2 right-2 flex justify-between items-center gap-2.5 pointer-events-none">
              <span class="product-card__badge product-card__badge--left"></span>
              <span class="product-card__badge product-card__badge--right"></span>
            </div>
          </div>
          <div class="mt-3 px-2 flex flex-col gap-2">
            <h3 class="product-card__title font-normal line-clamp-2"></h3>
            <div class="flex items-center gap-1 text-xs">
              <span class="product-card__rating" aria-hidden="true"></span>
              <span class="sr-only product-card__rating-sr"></span>
              <span class="product-card__reviews"></span>
            </div>
            <p class="product-card__price text-base"></p>
          </div>
        </a>
      </article>
    </li>
  </template>
  <script src="script.js"></script>
</body>
</html>
