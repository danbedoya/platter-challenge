<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platter Challenge – Best Sellers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white antialiased">
  <main>
    <section aria-labelledby="best-sellers-title" class="max-w-[1920px] mx-auto px-6 py-9">
      <header class="flex flex-col items-center md:flex-row md:justify-between mb-6">
        <h2 id="best-sellers-title" class="text-center text-[28px] font-bold md:text-[40px] md:font-black">
          Best Sellers
        </h2>
        <a href="#best-sellers" class="hidden md:inline-flex items-center gap-2 font-semibold text-sm hover:opacity-70">
          Shop All Best Sellers
        </a>
      </header>

      <div class="best-sellers__carousel-wrapper">
        <div class="best-sellers__grid-wrap" id="best-sellers-grid">
          <ul class="best-sellers__track" data-products-track aria-label="Product list">
            <!-- Product cards will be injected here -->
          </ul>
        </div>
        <div class="md:hidden mt-4">
          <button type="button" class="w-full py-4 rounded-full font-semibold bg-[#1C1D1D] text-white" data-show-more aria-expanded="false" aria-controls="best-sellers-grid">
            Show More
          </button>
        </div>
      </div>
    </section>
  </main>
  <template id="product-card-template">
    <li class="best-sellers__item">
      <article class="product-card">
        <a href="#" class="block group">
          <div class="relative aspect-square rounded-[10px] overflow-hidden bg-gray-100">
            <img class="product-card__img product-card__img--primary absolute inset-0 w-full h-full object-cover transition-opacity duration-200 group-hover:opacity-0" src="" alt="" />
            <img class="product-card__img product-card__img--secondary absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-200 group-hover:opacity-100" src="" alt="" />
          </div>
          <div class="mt-3 px-2 flex flex-col gap-2">
            <h3 class="product-card__title text-base font-normal leading-tight line-clamp-2"></h3>
            <div class="flex items-center gap-1 text-xs">
              <span class="product-card__rating" aria-hidden="true"></span>
              <span class="product-card__reviews"></span>
            </div>
            <p class="product-card__price font-semibold text-base"></p>
          </div>
        </a>
      </article>
    </li>
  </template>
  <script src="script.js"></script>
</body>
</html>
