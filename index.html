<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platter Challenge – Best Sellers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700;900&family=Bebas+Neue&family=Poppins:wght@400;500;600&display=optional" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white antialiased">
  <main>
    <section id="best-sellers" class="best-sellers" aria-labelledby="best-sellers-heading">
      <header class="best-sellers__header">
        <div class="best-sellers__header-inner flex flex-col items-center md:flex-row md:justify-between mb-6 md:mb-[38px]">
          <h2 id="best-sellers-heading" class="best-sellers__heading text-center text-[28px] font-bold md:text-[40px] md:font-black">
            Best Sellers
          </h2>
          <a href="#best-sellers" class="hidden md:inline-flex items-center gap-2 font-semibold text-sm text-[#5C553A] leading-[1.4] hover:opacity-70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white rounded-sm">
            Shop All Best Sellers
            <span class="inline-flex shrink-0" style="width:20px;height:20px;">
              <img src="assets/arrow-narrow-right.svg" alt="" width="20" height="20" class="inline-block" style="width:20px;height:20px;display:block;" />
            </span>
          </a>
        </div>
      </header>

      <product-list-view>
        <div class="best-sellers__grid-wrap" id="best-sellers-grid" data-grid-wrap>
          <ul class="best-sellers__track" data-products-track>
          </ul>
        </div>
        <div class="best-sellers__scrollbar-wrap hidden" data-scrollbar-wrapper>
          <div class="best-sellers__scrollbar" data-scrollbar>
            <div class="best-sellers__scrollbar-track" data-scrollbar-track>
              <div class="best-sellers__scrollbar-thumb" data-scrollbar-thumb></div>
            </div>
          </div>
        </div>
        <div class="md:hidden mt-3" data-show-more-wrap>
          <button type="button" class="show-more-btn w-full py-4 rounded-full font-semibold bg-[#1C1D1D] text-white" data-show-more aria-expanded="false" aria-controls="best-sellers-grid">
            Show More
          </button>
        </div>
      </product-list-view>
    </section>
  </main>
  <template id="product-card-template">
    <li class="best-sellers__item">
      <article class="product-card">
        <a href="#" class="block group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white rounded-[10px]">
          <div class="product-card__image-wrap relative aspect-square rounded-[10px] overflow-hidden bg-gray-100">
            <img class="product-card__img product-card__img--primary absolute inset-0 w-full h-full object-cover transition-opacity duration-200 group-hover:opacity-0" src="" alt="" width="400" height="400" decoding="async" />
            <img class="product-card__img product-card__img--secondary absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-200 group-hover:opacity-100" src="" alt="" width="400" height="400" loading="lazy" decoding="async" aria-hidden="true" />
            <div class="product-card__badges absolute top-2 left-2 right-3 flex justify-between items-center gap-2.5 pointer-events-none">
              <span class="product-card__badge product-card__badge--left product-card__badge--left-mobile" aria-hidden="true"></span>
              <span class="product-card__badge product-card__badge--left product-card__badge--left-desktop" aria-hidden="true"></span>
              <span class="product-card__badge product-card__badge--right product-card__badge--right-mobile" aria-hidden="true"></span>
              <span class="product-card__badge product-card__badge--right product-card__badge--right-desktop" aria-hidden="true"></span>
            </div>
          </div>
          <div class="mt-3 px-2 pb-[9px] flex flex-col gap-2">
            <h3 class="product-card__title font-normal line-clamp-2"></h3>
            <div class="flex items-center gap-1 text-xs">
              <span class="product-card__rating" aria-hidden="true"></span>
              <span class="sr-only product-card__rating-sr"></span>
              <span class="product-card__reviews"></span>
            </div>
            <p class="product-card__price text-base"></p>
          </div>
        </a>
      </article>
    </li>
  </template>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
